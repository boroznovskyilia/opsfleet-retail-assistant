[project]
name = "opsfleet-retail-assistant"
version = "0.1.0"
description = "A bounded retail analysis CLI with guarded BigQuery and confirmed report deletion"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "sqlglot>=28,<31",
  "httpx>=0.28,<1",
  "google-cloud-bigquery>=3.38,<4",
  "python-dotenv>=1.1,<2",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.21,<1",
  "sqlalchemy-bigquery>=1.15,<2",
]

[project.scripts]
retail-assistant = "retail_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_assistant"]
